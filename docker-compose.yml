services:
  # ─── FastAPI Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vigilrag-backend
    ports:
      - "18000:8000"  # host 18000 — avoids clash with other local stacks on :8000

    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      GITHUB_PAT: ${GITHUB_PAT:-${github-pat:-}}
      "github-pat": ${github-pat:-}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-${azure-storage-connection-string:-}}
      "azure-storage-connection-string": ${azure-storage-connection-string:-}
      AZURE_WIKI_CONTAINER: ${AZURE_WIKI_CONTAINER:-${azure-wiki-container:-"vigilrag-wiki"}}
      "azure-wiki-container": ${azure-wiki-container:-"vigilrag-wiki"}
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///./vigilrag.db}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      AGENT_SERVICE_URL: http://agent:8000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      AUDIT_EXPORT_TTL_SECONDS: ${AUDIT_EXPORT_TTL_SECONDS:-3600}
      ALLOWED_ORIGINS: '["http://localhost:15173","http://127.0.0.1:15173","http://localhost:5173","http://127.0.0.1:5173"]'
      MODEL_CARDS_DIR: /app/knowledge/model-cards
    volumes:
      - ./backend/app:/app/app  # live-reload in dev
      - ./mock_data:/app/mock_data
      - ./knowledge/model-cards:/app/knowledge/model-cards:ro
    networks:
      - vigilrag-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── LangGraph Agent Service ────────────────────────────────────────────────
  agent:
    build: ./agent
    container_name: vigilrag-agent
    ports:
      - "18001:8000"  # host 18001

    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      "gemini-api-key": ${gemini-api-key:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      BACKEND_URL: http://backend:8000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    volumes:
      - ./agent/app:/app/app
      - ./mock_data:/app/mock_data
    networks:
      - vigilrag-net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── Jaeger Observability All-in-One ───────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: vigilrag-jaeger
    ports:
      - "16687:16686" # Jaeger UI (host 16687 — :16686 often taken)
      - "14317:4317"  # OTLP gRPC
      - "14318:4318"  # OTLP HTTP
    networks:
      - vigilrag-net
    restart: unless-stopped

  # ─── React/TypeScript Frontend ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: http://localhost:18000
        VITE_AGENT_URL: http://localhost:18001
    container_name: vigilrag-frontend
    ports:
      - "15173:80"  # host 15173
    networks:
      - vigilrag-net
    depends_on:
      - backend
      - agent
    restart: unless-stopped

networks:
  vigilrag-net:
    driver: bridge
